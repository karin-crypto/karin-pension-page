<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#F7F4EE;font-family:"Heebo",sans-serif;color:#0F2747;position:relative}

.brand{position:absolute;right:86px;bottom:66px;font-size:28px;font-weight:500;color:#0F2747;display:flex;align-items:center;gap:16px}
.brand span.g{width:56px;height:3px;background:#C2A06B;display:inline-block}

<div class="frame"></div>

<rect width="470" height="630" fill="url(#n)"/>
<path d="M-20 630 C 60 470, 150 300, 470 170 L 470 250 C 250 330, 170 470, 150 630 Z" fill="url(#r)"/>
<path d="M50 630 C 130 470, 220 330, 470 205" fill="none" stroke="#C9A96E" stroke-width="3"/>
<path d="M0 120 C 120 100, 260 70, 470 40" fill="none" stroke="rgba(201,169,110,.35)" stroke-width="2"/>
</svg>
<div class="txt">
<div class="eb">תכנון פנסיוני</div>
<h1>הפנסיה שלך.<br>העתיד שלך.</h1>
<p>תכנון פנסיוני מתחיל בהבנת התמונה המלאה.</p>
